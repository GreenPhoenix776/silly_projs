        //defining horse class
        class Horse {
            constructor(name, spd, stam, accel, finish, red, green, blue){
                this.name = name;
                let nameSplit = name.split(" ");
                this.fname = nameSplit[0];
                this.lname = nameSplit[1];
                this.speed = spd;
                
                this.maxSpeed = 50 + (10*this.speed);
                this.storedMaxSpeed = this.maxSpeed; // used for when fatigued, so that the value is stored once it is halved.
                this.stamina = stam;
                
                this.maxStamina = 100 + (20 * this.stamina);
                this.acceleration = accel;
                
                this.effAcceleration = 5 + this.acceleration; //not a max, but the actual acceleration used in races.
                this.finish = finish;
                this.fatigue = 0; //every 200m traveled accrues 1 fatigue. Once fatigue crosses the fatigueTolerance, the horse's speed is halved for the next 800m(at G rank. higher speed lowers teh distance your speed is halved)
                this.fatigueTolerance = 5 + (this.stamina * 2);
                this.fatigueDistanceLeft = 800;
                this.isFatigued = false;
                this.velocity = 0;
                this.img = new Image();
                this.img.src = "img/horsePNG.png";
                this.red = red;
                this.blue = blue;
                this.color = [red, green, blue];
                this.parent1 = null;
                this.parent2 = null;
                this.stablesx = -100;
                this.stablesy = -100;
                this.choicex = -100;
                this.choicey = -100;

                this.changeColorForName(this.name);
                this.changeStatForName(this.name);

                this.speedGrade = this.getSpdRating();
                this.staminaGrade = this.getStaminaRating();
                this.accelerationGrade = this.getAccelerationRating();
                
            }

            //adjusts stats if name has certain aspects
            changeColorForName(name){
                if(name.includes("Cyan")){
                    this.color[1] += 35;
                    this.color[2] += 35;
                    if(this.color[1] > 255){ this.color[1] = 255}
                    if(this.color[2] > 255){this.color[2] = 255}
                } else if(name.includes("Azure")){
                    this.color[2] += 45;
                    if(this.color[2] > 255){this.color[2] = 255}
                } else if(name.includes("Crimson")){
                    this.color[0] += 45;
                    if(this.color[0] > 255){this.color[0] = 255}
                } else if(name.includes("Midori")){
                    this.color[1] += 45;
                    if(this.color[1] > 255){this.color[1] = 255}
                } else if(name.includes("Pale")){
                    this.color[0] += 35; this.color[1] += 35; this.color[2] += 35;
                    if(this.color[0] > 255){this.color[0] = 255}
                    if(this.color[1] > 255){this.color[1] = 255}
                    if(this.color[2] > 255){this.color[2] = 255}
                } else if(name.includes("Dark")){
                    this.color[0] -= 35; this.color[1] -= 35; this.color[2] -= 35;
                    if(this.color[0] < 0){this.color[0] = 0}
                    if(this.color[1] < 0){this.color[1] = 0}
                    if(this.color[2] < 0){this.color[2] = 0}
                }
            }

            changeStatForName(name){
                if(name === "Little Droplet"){
                    console.log(`UNIQUE NAME: ${name}`);
                    this.acceleration += 0.5;
                } else if(name === "Cyan Yoh"){
                    console.log(`UNIQUE NAME: ${name}`);
                    this.stamina -= 0.2;
                    this.speed += 0.3;
                } else if(name === "Mejiro McQueen"){
                    console.log(`UNIQUE NAME: ${name}`);
                    this.stamina += 0.7;
                } else if(name === "Reverie Calypso"){
                    console.log(`UNIQUE NAME: ${name}`);
                    this.speed += 0.45;
                } else if(name === "Yukiko Yasashi"){
                    console.log(`UNIQUE NAME: ${name}`);
                    this.stamina += 0.3;
                    this.acceleration += 0.2
                } else if(name === "Wind Kaze"){
                    console.log(`UNIQUE NAME: ${name}`);
                    this.speed += 0.6;
                } else if(name === "Sakura Sakura"){
                    console.log(`UNIQUE NAME: ${name}`);
                    this.acceleration += 0.25;
                    this.speed += 0.4;
                } else if(name === "Fire Emblem"){
                    console.log(`UNIQUE NAME: ${name}`);
                    this.stamina += 0.2;
                    this.speed += 0.2;
                    this.acceleration += 0.2;
                }
            }

            //assigns a letter grade to be associated with the horse's speed stat
            getSpdRating(){
                if(this.speed < 1){
                    return "G";
                } else if (this.speed >=1 && this.speed < 1.5){
                    return "F";
                } else if (this.speed >=1.5 && this.speed < 2){
                    return "F+";
                } else if (this.speed >= 2 && this.speed <2.3){
                    return "E";
                } else if (this.speed >= 2.3 && this.speed < 2.5){
                    return "E+";
                } else if (this.speed >= 2.5 && this.speed < 2.8){
                    return "D";
                } else if (this.speed >= 2.8 && this.speed < 3){
                    return "D+";
                } else if (this.speed >= 3 && this.speed < 3.3){
                    return "C";
                } else if (this.speed >= 3.3 && this.speed < 3.7){
                    return "C+";
                } else if (this.speed >= 3.7 && this.speed < 4){
                    return "B";
                } else if (this.speed >= 4 && this.speed < 4.6){
                    return "B+";
                } else if (this.speed >= 4.6 && this.speed < 5.3){
                    return "A";
                } else if (this.speed >= 5.3 && this.speed < 6){
                    return "A+";
                } else if (this.speed >= 6 && this.speed < 6.4){
                    return "S";
                } else if (this.speed >= 6.4){
                    return "S+";
                } else {
                    return "G";
                }
            }

            //assigns a letter grade to be associated with the horse's stamina stat
            getStaminaRating(){
                if(this.stamina < 0.5){
                    return "G";
                } else if (this.stamina >=.5 && this.stamina < 0.8){
                    return "F";
                } else if (this.stamina >=0.8 && this.stamina < 1){
                    return "F+";
                } else if (this.stamina >= 1 && this.stamina < 1.3){
                    return "E";
                } else if (this.stamina >= 1.3 && this.stamina < 1.6){
                    return "E+";
                } else if (this.stamina >= 1.6 && this.stamina < 2){
                    return "D";
                } else if (this.stamina >= 2 && this.stamina < 2.3){
                    return "D+";
                } else if (this.stamina >= 2.3 && this.stamina < 2.6){
                    return "C";
                } else if (this.stamina >= 2.6 && this.stamina < 3){
                    return "C+";
                } else if (this.stamina >= 3 && this.stamina < 3.3){
                    return "B";
                } else if (this.stamina >= 3.3 && this.stamina < 3.5){
                    return "B+";
                } else if (this.stamina >= 3.5 && this.stamina < 4){
                    return "A";
                } else if (this.stamina >= 4 && this.stamina < 4.3){
                    return "A+";
                } else if (this.stamina >= 4.3 && this.stamina < 4.6){
                    return "S";
                } else if (this.stamina >= 4.6){
                    return "S+";
                } else {
                    return "G";
                }
            }

            //assigns a letter grade to be associated with the horse's acceleration stat
            getAccelerationRating(){
                if(this.acceleration < 0.4){
                    return "G";
                } else if (this.acceleration >=.4 && this.acceleration < 0.8){
                    return "F";
                } else if (this.acceleration >=0.8 && this.acceleration < 1.2){
                    return "F+";
                } else if (this.acceleration >= 1.2 && this.acceleration < 1.6){
                    return "E";
                } else if (this.acceleration >= 1.6 && this.acceleration < 2){
                    return "E+";
                } else if (this.acceleration >= 2 && this.acceleration < 2.5){
                    return "D";
                } else if (this.acceleration >= 2.5 && this.acceleration < 3){
                    return "D+";
                } else if (this.acceleration >= 3 && this.acceleration < 3.3){
                    return "C";
                } else if (this.acceleration >= 3.3 && this.acceleration < 3.6){
                    return "C+";
                } else if (this.acceleration >= 3.6 && this.acceleration < 4){
                    return "B";
                } else if (this.acceleration >= 4 && this.acceleration < 4.5){
                    return "B+";
                } else if (this.acceleration >= 4.5 && this.acceleration < 5){
                    return "A";
                } else if (this.acceleration >= 5 && this.acceleration < 5.5){
                    return "A+";
                } else if (this.acceleration >= 5.5 && this.acceleration < 6){
                    return "S";
                } else if (this.acceleration >= 6){
                    return "S+";
                } else {
                    return "G";
                }
            }

            //assigns a letter grade to be associated with the horse's finish stat
            getFinishRating(){
                if(this.finish < 0.4){
                    return "G";
                } else if (this.finish >=.4 && this.finish < 0.8){
                    return "F";
                } else if (this.finish >=0.8 && this.finish < 1.2){
                    return "F+";
                } else if (this.finish >= 1.2 && this.finish < 1.6){
                    return "E";
                } else if (this.finish >= 1.6 && this.finish < 2){
                    return "E+";
                } else if (this.finish >= 2 && this.finish < 2.5){
                    return "D";
                } else if (this.finish >= 2.5 && this.finish < 3){
                    return "D+";
                } else if (this.finish >= 3 && this.finish < 3.3){
                    return "C";
                } else if (this.finish >= 3.3 && this.finish < 3.6){
                    return "C+";
                } else if (this.finish >= 3.6 && this.finish < 4){
                    return "B";
                } else if (this.finish >= 4 && this.finish < 4.5){
                    return "B+";
                } else if (this.finish >= 4.5 && this.finish < 5){
                    return "A";
                } else if (this.finish >= 5 && this.finish < 5.5){
                    return "A+";
                } else if (this.finish >= 5.5 && this.finish < 6){
                    return "S";
                } else if (this.finish >= 6){
                    return "S+";
                } else {
                    return "G";
                }
            }
        }

        //the state of the game. has some important variables that need global acesss

        let lNameList = ["Comet", "Dancer", "Calypso", "Whisper", "Blaze", "Thunder", "Drifter", "Gale", "Shadow", "Wind", "Spark", "Echo", "Strike", "Flame", "Runner", "Flicker", "Storm", "Flight", "Glide", "Dash", "Wanderer", "Breaker", "Surge", "Roar", "Wisp", "Saber", "Flash", "Streak", "Whirl", "Crash", "Crescent", "Skipper", "Breeze", "Shimmer", "Rider", "Spirit", "Charger", "Strider", "Fury", "Bolt", "Torrent", "Flick", "Trot", "Rush", "Leap", "Pulse", "Racer", "Wander", "Drift", "Ripple", "Crash", "Glint", "Flicker", "Glide", "Glimmer", "Cannon", "Echo", "Snap", "Rumble", "Spire", "Tide", "Whistle", "Moon", "Cinder", "Ember", "Whinny", "Reign", "Wraith", "Nudge", "Howl", "Chime", "Loom", "Spiral", "Whisk", "Trick", "Charm", "Clash", "Flick", "Prance", "Glimpse", "Hover", "Vault", "Swirl", "Whirl", "Skip", "Drizzle", "Comet", "Smoke", "Hush", "Charge", "Swoop", "Rebel", "Whisker", "Sparkle", "Stumble", "Grin", "Nuzzle", "Thump", "Crackle", "Zoom", "Quiver", "Swish", "Eater", "Nibbler", "McQueen", "Emblem", "Creek", "Kaze", "Yami", "Hikari", "Tsuki", "Hana", "Kumo", "Tora", "Sakura", "Inazuma", "Kiri", "Yasashi", "Droplet", "Yoh", "VTuber"];

        GameState.curHorse = new Horse("Reverie Calypso", 6, 3, 3, 3, 101, 88, 168);

        //generates a screen with a yes and no option to click.
        function generateYesNo(prompt){
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, 720, 720);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(180, 310, 150, 50);
            ctx.fillRect(390, 310, 150, 50);

        }

        

        //logs the information of the horse to the console
        function logHorse(horsie){
            console.log(`${horsie.name} : SPD(${horsie.speedGrade}) | STA(${horsie.staminaGrade}) | ACC(${horsie.accelerationGrade})`);
        }
        
        //sets an appropriate fillStyle according to the horse's stat rank
        function fillStyleGrade(grade){
            if(grade === "G"){ctx.fillStyle = "#888888";}
            else if(grade === "F" || grade === "F+"){ctx.fillStyle = "#202588";}
            else if(grade === "E" || grade === "E+"){ctx.fillStyle = "#a84590";}
            else if(grade === "D" || grade === "D+"){ctx.fillStyle = "#7979b8";}
            else if(grade === "C" || grade === "C+"){ctx.fillStyle = "#68c880";}
            else if(grade === "B" || grade === "B+"){ctx.fillStyle = "#ca7070";}
            else if(grade === "A" || grade === "A+"){ctx.fillStyle = "#caa770";}
            else {ctx.fillStyle = "#fab7bc";}
        }

        //pushes the horse into the stables list



        //gets a random integer between min and max (inclusive)
        function randInt(min, max) {
            min = Math.ceil(min);
            max = Math.floor(max);
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        //gets a random float between min and max (inclusive)
        function randFloat(min, max) {
            return Math.random() * (max - min) + min;
        }

        //generates a random horse of no higher than b quality in any stat.
        function randHorse(){
            name = `${fNameList[randInt(0, fNameList.length-1)]} ${lNameList[randInt(0, lNameList.length-1)]}`;
            speed = randFloat(0, 3.5);
            stamina = randFloat(0, 3);
            acceleration = randFloat(0, 3.5);
            finish = randFloat(0, 3);
            red = randInt(0, 255);
            green = randInt(0, 255);
            blue = randInt(0, 255);

            return new Horse(name, speed, stamina, acceleration, finish, red, green, blue);
        }

        //deletes a horse from the stables
        function deleteHorse(horse){
            index = GameState.stables.indexOf(horse);
            GameState.stables.splice(index, 1);
        }

        //breeds two horses. The avg of each of the stats +- some small random number will be the stats of the child. returns the resulting child horse.
        function breedHorses(horse1, horse2){
            const speed = ((horse1.speed + horse2.speed)/2) +  randFloat(-0.3, 0.3);
            if(speed < 0){speed = 0;}
            const stamina = ((horse1.stamina + horse2.stamina)/2) + randFloat(-0.45, 0.45);
            if(stamina < 0){stamina = 0;}
            const acceleration = ((horse1.acceleration + horse2.acceleration)/2) + randFloat(-0.35, 0.35);
            if(acceleration < 0){acceleration = 0;}
            const finish = ((horse1.finish + horse2.finish)/2) + randFloat(-0.4, 0.4);
            if(finish < 0){finish = 0;}
            const red = ((horse1.color[0] + horse2.color[0])/2) + randInt(-20, 20);
            if(red < 0){red = 0;}else if(red > 255){red = 255;}
            const blue = ((horse1.color[2] + horse2.color[2])/2) + randInt(-20, 20);
            if(blue < 0){blue = 0;}else if(blue > 255){blue = 255;}
            const green = ((horse1.color[1] + horse2.color[1])/2) + randInt(-20, 20);
            if(green < 0){green = 0;}else if(green > 255){green = 255;}

            let keepFname = randInt(0, 3);
            let keepLname = randInt(0, 3);
            let fname;
            let lname;
            if(keepFname === 0){
                console.log("KEEPING FNAME");
                fname = horse1.fname;
            } else {fname = fNameList[randInt(0, fNameList.length-1)]}
            if(keepLname === 0){
                console.log("KEEPING LNAME");
                lname = horse2.lname;
            } else {lname = lNameList[randInt(0, lNameList.length-1)]}
            name = `${fname} ${lname}`;

            child = new Horse(name, speed, stamina, acceleration, finish, red, green, blue);
            child.parent1 = horse1;
            child.parent2 = horse2;

            return child;
        }

        //draws the horse on screen with it's proper color;
        function drawHorse(horse, x, y){
            ctx.drawImage(horse.img, x, y);
            ctx.globalCompositeOperation = "color";
            ctx.fillStyle = `rgb(${horse.color[0]}, ${horse.color[1]}, ${horse.color[2]})`;
            ctx.fillRect(x, y, 64, 64);
            ctx.globalCompositeOperation = "source-over";
            
        }

        //functions for loading each screen

        //shows the tabs at the bottom for menu navigation in the main menus' screens
        function showNavPanels(){
            ctx.fillStyle = "#999999";
            ctx.fillRect(0, 660, 720, 60);
            ctx.fillStyle = "#111111";
            ctx.fillRect(0, 660, 720, 2);
            for (let x = 0; x < 5; x++){
                ctx.fillRect(x * 144, 660, 2, 60);
            }
            ctx.fillRect(718, 660, 2, 60);
            
            //fills in the current menu along the navbar with a reddish color
            ctx.fillStyle = "#ff8080";
            if(GameState.screenState === "HomeScreen"){
                ctx.fillRect(290, 662, 142, 60);
            } else if(GameState.screenState === "StablesScreen"){
                ctx.fillRect(434, 662, 142, 60);
            } else if(GameState.screenState === "BreedingScreen"){
                ctx.fillRect(578, 662, 140, 60);
            } else if(GameState.screenState === "StartCareerScreen"){
                ctx.fillRect(2, 662, 142, 60);
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "20px ComicSans";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillText("Career", 72, 680);
            ctx.fillText("Shop", 216, 680);
            ctx.fillText("Home", 360, 680);
            ctx.fillText("Stables", 504, 680);
            ctx.fillText("Inheritance", 648, 680);
        }

        //loads the stables screen
        function stablesScreen(){
            showNavPanels();

            //loads a sort of header in the screen
            ctx.font = "40px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillText(`STABLES: ${GameState.stables.length}/64`, 360, 10);
            
            //loads the horses inside the stables
            ctx.font = "15px Sans";
            ctx.textAlign = "left";
            ctx.textBaseline = "bottom";
            for(let i = 0; i < GameState.stables.length ; i++){
                horse = GameState.stables[i];
                row = Math.floor(i/8);
                column = (i % 8);
                x = 35 + (column * 64) + (column* 20); //base margin + png size + buffer size (between images);
                y = 50 + (row * 64) + (row * 10);
                horse.stablesx = x;
                horse.stablesy = y;
                drawHorse(horse, x, y);
                ctx.fillStyle = "#ffffff";
                ctx.fillText(horse.name, x, y+64, 64);
            }
        }

        //load horse data screen
        function loadHorseDataScreen(horse){
            //back button appearance
            ctx.font = "30px ComicSans";
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(10, 10, 50, 35);
            ctx.fillStyle = "#121212";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Back", 35, 30, 50);
            ctx.textBaseline = "top";
            

            //loads a bunch of text for the horse's stats and shit
            ctx.font = "45px Arial";
            drawHorse(horse, 328, 40);
            ctx.fillStyle = "#ffffff";
            ctx.fillText(horse.name, 360, 104);
            ctx.textAlign = "right";    
            ctx.fillText("SPEED: ", 230, 280, 200);
            ctx.fillText("STAMINA: ", 230, 320, 200);
            ctx.fillText("ACCELERATION:", 215, 360, 210);
            ctx.fillText("FINISH: ", 230, 400, 200);
            ctx.textAlign = "center";
            ctx.fillText("Parent1", 525, 240, 200);
            ctx.fillText("Parent2", 525, 360, 200);
            ctx.font = "30px ComicSans";
            if(horse.parent1 != null){
                ctx.textAlign = "left";
                drawHorse(horse.parent1, 450, 280);
                ctx.fillStyle = "#ffffff";
                ctx.fillText(horse.parent1.name, 515, 300, 200);
            }
            if(horse.parent2 != null){
                ctx.textAlign = "left";
                drawHorse(horse.parent2, 450, 400);
                ctx.fillStyle = "#ffffff";
                ctx.fillText(horse.parent2.name, 515, 420, 200);
            }
            ctx.font = "45px Arial";
            ctx.fillStyle = fillStyleGrade(horse.speedGrade);
            ctx.fillText(horse.speedGrade, 250, 280);
            ctx.fillStyle = fillStyleGrade(horse.staminaGrade);
            ctx.fillText(horse.staminaGrade, 250, 320);
            ctx.fillStyle = fillStyleGrade(horse.accelerationGrade);
            ctx.fillText(horse.accelerationGrade, 250, 360);
            //ctx.fillStyle = fillStyleGrade(horse.finishGrade);
            //ctx.fillText(horse.finishGrade, 250, 400);
            
        }

        //loads the home screen
        function homeScreen(){
            showNavPanels();    
        }

        //the screen where you choose which horse to race with for career

        //helper function for selcting horses outside the stables that displayes the horses
        function displayHorseChoices(){
            ctx.font = "20px ComicSans";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            for(let i = 0; i < GameState.stables.length; i++){
                horse = GameState.stables[i];
                if(GameState.breedHorsesChosen.includes(horse) === false){
                    ctx.fillStyle = `rgb(${horse.color[0]},${horse.color[1]},${horse.color[2]})`;
                    row = Math.floor(i/4);
                    column = (i % 4);
                    x = 35 + (column * 80) + (column* 14); //base margin + block size + buffer size (between blocks);
                    y = 50 + (row * 20) + (row * 10);
                    horse.choicex = x;
                    horse.choicey = y;
                    ctx.fillRect(x, y, 80, 20);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(horse.name, x, y, 80);
                } else if(GameState.breedHorsesChosen.includes(horse)|| horse === GameState.curHorse){
                    ctx.font = "45px ComicSans";
                    ctx.fillStyle = `rgb(${horse.color[0]},${horse.color[1]},${horse.color[2]})`;
                    horse.choicex = 480;
                    horse.choicey = 50;
                    ctx.fillRect(480, 50, 120, 50);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(horse.name, 480, 50, 120);
                    ctx.font = "20px ComicSans";
                } 
                
            }
        }

        
        //the screen where you choose two horses you want to breed
        function breedingScreen(){
            showNavPanels();
            displayHorseChoices();
            if(GameState.breedHorsesChosen.length >= 2){
                console.log("ready");
                if(GameState.waitingForYesNo){
                    generateYesNo(`Breed ${GameState.breedHorsesChosen[0].name} and ${GameState.breedHorsesChosen[1].name}?`);
                } else {
                    if(GameState.yesNo){
                    let newHorse = breedHorses(GameState.breedHorsesChosen[0], GameState.breedHorsesChosen[1]);
                    
                        if(GameState.stables.length < 64){
                            GameState.stables.push(newHorse);
                        }
                    }
                    GameState.breedHorsesChosen = [];
                    GameState.yesNo = null;
                }

            }
            
            

        }

        
        //loads the start screen
        function startScreen(){
            ctx.font = "45px Arial";
            ctx.fillStyle = "#dddddd";
            ctx.strokeStyle = "#ffcdcd";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Click to Start!", 360, 360, 300);
        }

        //gets the position of the mouse
        addEventListener('mousemove', function(event){
            mousePos.x = event.clientX;
            mousePos.y = event.clientY;
        });

        //upon clicking, does stuff based on the screen state.
        addEventListener('click', function(){

            console.log("MousePos: ", mousePos.x, mousePos.y);
            console.log(GameState.breedHorsesChosen)
            console.log(GameState.waitingForYesNo);

            //starts the game
            if (GameState.screenState === "StartScreen"){
                GameState.screenState = "HomeScreen";
                console.log("Game started");
            //for all menu screens, allows interaction of switching between other menu screens
            } else if((GameState.screenState === "HomeScreen" || GameState.screenState === "StablesScreen" || GameState.screenState === "BreedingScreen" || GameState.screenState === "StartCareerScreen" ||GameState.screenState === "ShopScreen") && !GameState.waitingForYesNo){
                if(mousePos.x > 2 && mousePos.x < 144 && mousePos.y > 662){
                    GameState.screenState = "StartCareerScreen";
                } else if(mousePos.x > 146 && mousePos.x < 288 && mousePos.y > 662){
                    GameState.screenState = "ShopScreen"; 
                } else if(mousePos.x > 290 && mousePos.x < 432 && mousePos.y > 662){
                    GameState.screenState = "HomeScreen";
                } else if(mousePos.x > 434 && mousePos.x < 576 && mousePos.y > 662){
                    GameState.screenState = "StablesScreen";
                } else if(mousePos.x > 578 && mousePos.x < 720 && mousePos.y > 662){
                    GameState.screenState = "BreedingScreen";
                    GameState.breedHorsesChosen = [];
                }
            }

            //stables screen clicks
            if (GameState.screenState === "StablesScreen"){
                for(horse of GameState.stables){
                    if(mousePos.x >= horse.stablesx && mousePos.x <= horse.stablesx + 64 && mousePos.y >= horse.stablesy && mousePos.y < horse.stablesy + 64){
                        GameState.horseLoad = horse;
                        GameState.screenState = "LoadHorseDataScreen";
                        GameState.lastScreen = "StablesScreen";
                        break;
                    }
                }
            }

            //clicks for the screen showing a horse's data
            if (GameState.screenState === "LoadHorseDataScreen"){
                if(mousePos.x >= 10 && mousePos.x < 60 && mousePos.y >= 10 && mousePos.y < 45){
                    GameState.screenState = GameState.lastScreen;
                    GameState.lastScreen = "None";
                }
            }

            //breeding screen clicks
            if(GameState.screenState === "BreedingScreen"){
                for (horse of GameState.stables){
                    if(GameState.breedHorsesChosen.length < 2){
                        if(mousePos.x >= horse.choicex && mousePos.x < horse.choicex + 80 && mousePos.y >= horse.choicey && mousePos.y < horse.choicey + 20){
                            GameState.breedHorsesChosen.push(horse);
                            if(GameState.breedHorsesChosen.length >= 2){
                                GameState.waitingForYesNo = true;
                            }
                        }
                    }
                }
            }

            //yes no screen
            if(GameState.waitingForYesNo){
                if(mousePos.x >= 180 && mousePos.x < 330 && mousePos.y >= 310 && mousePos.y < 360){
                    GameState.yesNo = true;
                    GameState.waitingForYesNo = false;
                } else if(mousePos.x >= 390 && mousePos.x < 540 && mousePos.y >= 310 && mousePos.y < 360){
                    GameState.yesNo = false
                    GameState.waitingForYesNo = false;
                }
            }
        });



        //animation loop
        animationId = requestAnimationFrame(animate);

        function animate(){
            animationId = requestAnimationFrame(animate);

            //clears screene every frame
            ctx.clearRect(0,0,720,720);
            ctx.fillStyle = '#785630';
            ctx.fillRect(0,0,720,720);
            
            //if on start screen, load the start screen
            if(GameState.screenState === "StartScreen"){
                startScreen();
            }else if(GameState.screenState === "StablesScreen"){ 
                stablesScreen();
            }else if(GameState.screenState === "LoadHorseDataScreen" && GameState.horseLoad != null){
                loadHorseDataScreen(GameState.horseLoad);
            }else if(GameState.screenState === "HomeScreen"){
                homeScreen();
            }else if(GameState.screenState === "ShopScreen"){
                generateYesNo();
            }else if(GameState.screenState === "BreedingScreen"){
                breedingScreen();
            }else {
                showNavPanels();
                drawHorse(horsie, 12, 12);
                drawHorse(horser, 80, 12);
                drawHorse(horso, 46, 80);
            }
        }

        

    </script>
</body>
</html>
